[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "pdf-merge-ai-mcp"
version = "1.0.7"
readme = "README.md"
description = "Pdf Merge Ai Mcp: merge info (Plan a PDF merge operation. Provide file descriptions as JSO); split info (Plan a PDF split operation. Split spec examples: 'every 5' (); get metadata (Extract or generate PDF metadata. Provide either base64-enco); validate pdf (Validate PDF structure from base64-encoded header bytes. Che). pip install pdf-merge-ai-mcp."
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "MEOK AI Labs", email = "nicholas@meok.ai"}]
dependencies = ["mcp>=1.0.0"]
keywords = ["mcp", "ai", "meok", "pdf", "merge"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
[project.urls]
Homepage = "https://meok.ai"
Repository = "https://github.com/CSOAI-ORG/pdf-merge-ai-mcp"
[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py", "auth_middleware.py"]

[project.scripts]
pdf_merge_ai_mcp = "server:main"
