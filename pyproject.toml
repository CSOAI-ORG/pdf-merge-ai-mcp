[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "pdf-merge-ai-mcp"
version = "1.0.6"
readme = "README.md"
description = "AI-powered pdf merge ai MCP server for agents. Supports merge pdfs, split pdf, get pdf info. By MEOK AI Labs."
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "MEOK AI Labs", email = "nicholas@meok.ai"}]
dependencies = ["mcp>=1.0.0"]
keywords = ["mcp", "ai", "meok", "pdf", "merge"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
[project.urls]
Homepage = "https://meok.ai"
Repository = "https://github.com/CSOAI-ORG/pdf-merge-ai-mcp"
[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py", "auth_middleware.py"]

[project.scripts]
pdf_merge_ai_mcp = "server:main"
