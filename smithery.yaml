name: pdf-merge-ai-mcp
description: AI-powered pdf merge ai MCP server for agents. Supports merge pdfs, split
  pdf, get pdf info. By MEOK AI Labs.
version: 1.0.0
tools:
- name: merge_pdfs
  description: MEOK AI Labs tool.
  parameters:
  - name: file_paths
    type: string
    required: true
- name: split_pdf
  description: MEOK AI Labs tool.
  parameters:
  - name: file_path
    type: string
    required: true
  - name: pages
    type: string
    required: true
- name: get_pdf_info
  description: MEOK AI Labs tool.
  parameters:
  - name: file_path
    type: string
    required: true
- name: extract_pages
  description: MEOK AI Labs tool.
  parameters:
  - name: file_path
    type: string
    required: true
  - name: start
    type: integer
    required: true
  - name: end
    type: integer
    required: true
